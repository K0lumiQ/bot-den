services:
  - type: web
    name: tg-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_HOST
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PORT
        value: "8080"
